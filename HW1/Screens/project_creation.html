<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsTrack - New Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .card-bg {
            background-color: #1e293b; 
            border: 1px solid #334155; 
        }
        input, textarea, select {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            color: white !important;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #3b82f6 !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Navigation (Matching Dashboard) -->
    <nav class="border-b border-slate-700 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="font-bold text-xl tracking-tight flex items-center gap-2">
                    <div class="w-2 h-6 bg-blue-500 rounded-sm"></div>
                    ConsTrack
                </div>
                <div class="hidden md:flex gap-4 ml-8 text-sm font-medium text-slate-400">
                    <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
                    <a href="project_details.html" class="hover:text-white transition-colors">Projects</a>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <a href="login.html" class="text-sm text-slate-400 hover:text-white transition-colors">Logout</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-6 max-w-3xl mx-auto w-full">
        <div class="card-bg rounded-xl p-8 shadow-2xl relative overflow-hidden">
            <!-- Decorative accent -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>

            <h1 class="text-2xl font-bold mb-6">Create New Project</h1>
            
            <form id="creationForm">
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Project Name</label>
                        <input id="projName" type="text" class="w-full px-4 py-3 rounded-lg transition-all" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Budget ($)</label>
                        <input id="projBudget" type="number" class="w-full px-4 py-3 rounded-lg transition-all" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Expected Finish Date</label>
                        <input id="projDate" type="date" class="w-full px-4 py-3 rounded-lg transition-all" required>
                    </div>

                    <div class="flex justify-end space-x-3 mt-6 pt-6 border-t border-slate-700">
                        <a href="dashboard.html" class="px-4 py-2 border border-slate-600 rounded-lg text-slate-300 hover:bg-slate-700 transition-colors font-medium">Cancel</a>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">Create Project</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Pure JS Form Handling mimicking system interaction
        document.getElementById('creationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Extracting data to show JS data interaction
            const dataObj = {
                name: document.getElementById('projName').value,
                budget: parseFloat(document.getElementById('projBudget').value),
                date: document.getElementById('projDate').value
            };
            
            console.log("Saving to fake database:", dataObj);
            alert(`Project '${dataObj.name}' successfully created in the system!`);
            
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
