<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsTrack - Project Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .card-bg {
            background-color: #1e293b; 
            border: 1px solid #334155; 
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Navigation (Matching Dashboard) -->
    <nav class="border-b border-slate-700 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="font-bold text-xl tracking-tight flex items-center gap-2">
                    <div class="w-2 h-6 bg-blue-500 rounded-sm"></div>
                    ConsTrack
                </div>
                <div class="hidden md:flex gap-4 ml-8 text-sm font-medium text-slate-400">
                    <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
                    <a href="project_details.html" class="text-white border-b-2 border-blue-500 pb-1">Projects</a>
                    <a href="reports.html" class="hover:text-white transition-colors">Reports</a>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <a href="login.html" class="text-sm text-slate-400 hover:text-white transition-colors">Logout</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-6 max-w-[1600px] mx-auto w-full flex flex-col gap-6">
        <div id="project-view-container" class="w-full">
            <!-- Content Injected via Vanilla JS -->
            <div class="text-center py-10"><p class="text-slate-500">Loading project data...</p></div>
        </div>
    </main>

    <script>
        // Fake Data representing a single fetched project
        const projectData = {
            name: "Downtown Highrise",
            status: "In Progress",
            address: "123 Business Blvd, City Center",
            description: "Construction of a 30-story commercial office building with underground parking. Currently in the structural framing phase.",
            progress: 73,
            budget: 12500000,
            startDate: "Jan 15, 2026",
            endDate: "Oct 12, 2026",
            manager: "Sarah Jenkins",
            updates: [
                { initials: "JD", name: "John Doe", text: "Foundation pouring completed and approved by inspector.", time: "2 days ago" },
                { initials: "AS", name: "Alice Smith", text: "Steel delivery received on site. Moving to zone A.", time: "5 days ago" }
            ]
        };

        function renderProjectDetails() {
            const container = document.getElementById('project-view-container');
            const formattedBudget = "$" + projectData.budget.toLocaleString();

            let updatesHtml = projectData.updates.map(update => `
                <li class="flex gap-4 border-b border-slate-700/50 pb-4 last:border-0 last:pb-0">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-blue-400 font-bold shrink-0 border border-slate-600">${update.initials}</div>
                    <div>
                        <p class="text-sm font-medium text-slate-200">${update.text}</p>
                        <p class="text-xs text-slate-500 mt-1">By <span class="text-slate-400">${update.name}</span> • ${update.time}</p>
                    </div>
                </li>
            `).join('');

            container.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <div class="flex items-center gap-3">
                            <h1 class="text-3xl font-bold text-white">${projectData.name}</h1>
                            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">${projectData.status}</span>
                        </div>
                        <p class="text-slate-400 mt-1 flex items-center gap-2"><i class="fa-solid fa-location-dot"></i> ${projectData.address}</p>
                    </div>
                    <div class="flex space-x-3">
                        <button class="card-bg hover:bg-slate-700 px-4 py-2 text-sm font-medium rounded-lg transition-colors">Edit Project</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="card-bg rounded-xl p-6">
                            <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-circle-info text-blue-400"></i> Project Overview</h2>
                            <p class="text-slate-400 mb-6 leading-relaxed">${projectData.description}</p>
                            
                            <div>
                                <div class="flex justify-between text-sm font-medium mb-2">
                                    <span class="text-slate-300">Overall Progress</span>
                                    <span class="text-blue-400">${projectData.progress}%</span>
                                </div>
                                <div class="w-full bg-slate-900 rounded-full h-3 border border-slate-700">
                                    <div class="bg-blue-500 h-full rounded-full shadow-[0_0_10px_rgba(59,130,246,0.6)]" style="width: ${projectData.progress}%"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-bg rounded-xl p-6">
                            <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-purple-400"></i> Recent Updates</h2>
                            <ul class="space-y-4">
                                ${updatesHtml}
                            </ul>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="card-bg rounded-xl p-6">
                            <h2 class="text-xl font-bold mb-6">Key Details</h2>
                            <div class="space-y-4 text-sm">
                                <div class="flex justify-between items-center pb-2 border-b border-slate-700/50"><span class="text-slate-400">Budget</span><span class="font-medium text-white">${formattedBudget}</span></div>
                                <div class="flex justify-between items-center pb-2 border-b border-slate-700/50"><span class="text-slate-400">Start Date</span><span class="font-medium text-white">${projectData.startDate}</span></div>
                                <div class="flex justify-between items-center pb-2 border-b border-slate-700/50"><span class="text-slate-400">Est. Completion</span><span class="font-medium text-orange-400">${projectData.endDate}</span></div>
                                <div class="flex justify-between items-center"><span class="text-slate-400">Project Manager</span><span class="font-medium text-white">${projectData.manager}</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', renderProjectDetails);
    </script>
</body>
</html>
