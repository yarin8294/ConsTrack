<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsTrack - Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
        }
        .card-bg {
            background-color: #1e293b; 
            border: 1px solid #334155; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Navigation (Matching Dashboard) -->
    <nav class="border-b border-slate-700 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-6">
                <div class="font-bold text-xl tracking-tight flex items-center gap-2">
                    <div class="w-2 h-6 bg-blue-500 rounded-sm"></div>
                    ConsTrack
                </div>
                <div class="hidden md:flex gap-4 ml-8 text-sm font-medium text-slate-400">
                    <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
                    <a href="project_details.html" class="hover:text-white transition-colors">Projects</a>
                    <a href="reports.html" class="text-white border-b-2 border-blue-500 pb-1">Reports</a>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <a href="login.html" class="text-sm text-slate-400 hover:text-white transition-colors">Logout</a>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-6 max-w-[1200px] mx-auto w-full">
        <div class="mb-6 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold mb-1">Generated Reports</h1>
                <p class="text-slate-400 text-sm">Access and download analytics from comparison runs.</p>
            </div>
            <button onclick="generateNewReport()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">
                <i class="fa-solid fa-plus mr-1"></i> Generate New
            </button>
        </div>

        <div class="card-bg rounded-xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                <h2 class="font-semibold text-lg flex items-center gap-2"><i class="fa-regular fa-folder-open text-yellow-500"></i> Document Library</h2>
            </div>
            <ul id="reports-list" class="divide-y divide-slate-700/50">
                <!-- Injected by JS -->
            </ul>
        </div>
    </main>

    <script>
        // Fake Data Array for Reports
        const reportsData = [
            { id: 1, title: "Q1 2026 Comparison Summary", type: "PDF", size: "2.4 MB", date: "Apr 01, 2026" },
            { id: 2, title: "Volume Change Analysis", type: "PDF", size: "1.1 MB", date: "Mar 28, 2026" },
            { id: 3, title: "Resource Allocation Matrix", type: "CSV", size: "0.5 MB", date: "Mar 15, 2026" }
        ];

        function renderReports() {
            const list = document.getElementById('reports-list');
            list.innerHTML = '';

            reportsData.forEach(report => {
                const li = document.createElement('li');
                li.className = "px-6 py-4 hover:bg-slate-700/30 flex justify-between items-center cursor-pointer transition-colors";
                
                let icon = report.type === 'PDF' ? '<i class="fa-solid fa-file-pdf text-red-400 text-xl"></i>' : '<i class="fa-solid fa-file-csv text-emerald-400 text-xl"></i>';

                li.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center shrink-0">
                            ${icon}
                        </div>
                        <div>
                            <p class="font-medium text-white">${report.title}</p>
                            <p class="text-xs text-slate-400 mt-1">${report.type} • ${report.size} • Generated ${report.date}</p>
                        </div>
                    </div>
                    <button class="text-blue-400 hover:text-blue-300 text-sm font-medium border border-blue-500/30 bg-blue-500/10 hover:bg-blue-500/20 px-4 py-1.5 rounded-md transition-colors">
                        Download
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function generateNewReport() {
            // Demonstrating JS data interaction by updating array and re-rendering
            reportsData.unshift({
                id: Date.now(),
                title: "Ad-hoc Comparison Report",
                type: "PDF",
                size: "0.8 MB",
                date: "Just now"
            });
            renderReports();
            alert("New report generated and added to the list using Vanilla JS!");
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', renderReports);
    </script>
</body>
</html>
