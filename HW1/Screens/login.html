<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsTrack - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
        }
        .card-bg {
            background-color: #1e293b; /* slate-800 */
            border: 1px solid #334155; /* slate-700 */
        }
        input {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: white !important;
        }
        input:focus {
            border-color: #3b82f6 !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="card-bg p-8 rounded-xl shadow-2xl max-w-md w-full relative overflow-hidden">
        <!-- Decorative glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-blue-500 rounded-full blur-[80px] opacity-20"></div>

        <div class="text-center mb-8 relative z-10">
            <div class="flex items-center justify-center gap-2 mb-4">
                <div class="w-3 h-8 bg-blue-500 rounded-sm"></div>
                <h1 class="text-4xl font-bold tracking-tight">ConsTrack</h1>
            </div>
            <p class="text-slate-400">Sign in to manage your construction projects</p>
        </div>
        
        <form id="loginForm" class="relative z-10">
            <div class="mb-4">
                <label class="block text-slate-300 text-sm font-semibold mb-2">Email Address</label>
                <input id="email" class="w-full py-3 px-4 rounded-lg transition-all" type="email" value="admin@constrack.com" required>
            </div>
            <div class="mb-6">
                <label class="block text-slate-300 text-sm font-semibold mb-2">Password</label>
                <input id="password" class="w-full py-3 px-4 rounded-lg mb-3 transition-all" type="password" value="password" required>
            </div>
            <button class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all" type="submit">
                Sign In
            </button>
        </form>
    </div>

    <script>
        // Pure Vanilla JS to handle login action
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            console.log("Authentication logic handling data:", { email: email });
            alert("Authentication successful! Redirecting to Dashboard...");
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
